<div class="af-page-head">
  <div>
    <h2>Nhãn</h2>
    <p>Nhãn dùng chung trong dự án. Gắn/gỡ nhãn trong chi tiết issue.</p>
  </div>
  @if (!ctx.readonly()) {
    <button nz-button nzType="primary" (click)="openCreate()">
      <span nz-icon nzType="plus"></span> Tạo nhãn
    </button>
  }
</div>

<div class="af-panel">
  <nz-table
    #table
    [nzData]="rows()"
    [nzFrontPagination]="false"
    nzSize="middle"
    [nzNoResult]="'Chưa có nhãn'"
  >
    <thead>
      <tr>
        <th>Nhãn</th>
        <th>Màu</th>
        <th>Số issue</th>
        @if (!ctx.readonly()) {
          <th nzWidth="110px"></th>
        }
      </tr>
    </thead>
    <tbody>
      @for (r of table.data; track r.label.id) {
        <tr>
          <td><app-label-tag [label]="r.label"></app-label-tag></td>
          <td class="af-muted">{{ r.label.color }}</td>
          <td>{{ r.count }}</td>
          @if (!ctx.readonly()) {
            <td>
              <button nz-button nzType="text" nzSize="small" (click)="openEdit(r.label)">
                <span nz-icon nzType="edit"></span>
              </button>
              <button
                nz-button
                nzType="text"
                nzSize="small"
                nzDanger
                nz-popconfirm
                [nzPopconfirmTitle]="
                  r.count ? 'Nhãn sẽ được gỡ khỏi ' + r.count + ' issue. Xoá?' : 'Xoá nhãn này?'
                "
                nzOkText="Xoá"
                nzCancelText="Huỷ"
                (nzOnConfirm)="remove(r.label)"
              >
                <span nz-icon nzType="delete"></span>
              </button>
            </td>
          }
        </tr>
      }
    </tbody>
  </nz-table>
</div>

<nz-modal
  [nzVisible]="modalOpen()"
  [nzTitle]="editing() ? 'Sửa nhãn' : 'Tạo nhãn'"
  [nzOkText]="editing() ? 'Lưu' : 'Tạo'"
  nzCancelText="Huỷ"
  [nzOkLoading]="saving()"
  (nzOnOk)="save()"
  (nzOnCancel)="modalOpen.set(false)"
>
  <ng-container *nzModalContent>
    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="save()">
      <nz-form-item>
        <nz-form-label nzRequired>Tên</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập tên (tối đa 50 ký tự, không trùng trong dự án)">
          <input nz-input formControlName="name" maxlength="50" placeholder="backend" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>Màu</nz-form-label>
        <nz-form-control nzErrorTip="Màu dạng #RRGGBB">
          <input type="color" class="af-color-input" formControlName="color" />
          <div class="presets">
            @for (c of presets; track c) {
              <span class="preset" [style.background]="c" (click)="pickPreset(c)"></span>
            }
          </div>
        </nz-form-control>
      </nz-form-item>
      <button type="submit" hidden></button>
    </form>
  </ng-container>
</nz-modal>
